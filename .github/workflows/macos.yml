name: macOS
on:
  push:
    branches: [master]
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        xcode: ['16.4', '26.0']
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Test
        run: ./scripts/test.sh
      - name: Build app
        run: ./scripts/build-app.sh
      - name: Archive
        run: ditto -c -k --sequesterRsrc --keepParent dist/BMusic.app dist/BMusic-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BMusic-macOS-Xcode-${{ matrix.xcode }}
          path: dist/BMusic-macOS.zip
